[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workspace-atlas"
version = "0.1.0"
description = "Lokalni katalog projekata, skillova, pluginova i MCP servera"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
dev = ["playwright>=1.45"]

[project.scripts]
atlas = "atlas.cli:main_entry"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
atlas = ["ui/*.html", "ui/*.js", "ui/*.css"]
